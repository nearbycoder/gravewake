[package]
name = "gravewake"
version = "0.1.0"
edition = "2024"
description = "A procedural gothic arena roguelite built with a custom Rust renderer"

[dependencies]
wgpu = "25.0.2"
winit = "0.30.12"
egui = "0.32.3"
egui-wgpu = "0.32.3"
glam = { version = "0.30", features = ["serde"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
rapier3d = { version = "0.26", features = ["enhanced-determinism"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rodio = { version = "0.20", default-features = false, features = ["wav"] }
gilrs = "0.11"
# `Instant` that also works in the browser; on desktop it is std's own.
web-time = "1"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
[profile.release]
lto = "thin"
codegen-units = 1

# The input review's fake keyboard and mouse (`src/input_review.rs`), and
# reading the keyboard layout (`src/keymap.rs`). All three crates are already
# in winit's dependency tree on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
xkbcommon-dl = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = "0.32.3"

# The browser build (`scripts/build-pages.sh`): WebGPU where the browser has
# it, WebGL2 otherwise, Web Audio through cpal, and browser storage for saves.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# No clipboard in the browser build: arboard has no web backend.
egui-winit = { version = "0.32.3", default-features = false }
# The web build embeds WebP copies of the large art (assets/web/).
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
wgpu = { version = "25.0.2", features = ["webgl"] }
rodio = { version = "0.20", default-features = false, features = ["wav", "wasm-bindgen"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "Storage", "console", "Navigator", "Location"] }
