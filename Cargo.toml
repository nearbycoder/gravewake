[package]
name = "gravewake"
version = "0.1.0"
edition = "2024"
description = "A procedural gothic arena roguelite built with a custom Rust renderer"

[dependencies]
wgpu = "25.0.2"
winit = "0.30.12"
egui = "0.32.3"
egui-winit = "0.32.3"
egui-wgpu = "0.32.3"
glam = { version = "0.30", features = ["serde"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
rapier3d = { version = "0.26", features = ["enhanced-determinism"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rodio = { version = "0.20", default-features = false, features = ["wav"] }
gilrs = "0.11"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
[profile.release]
lto = "thin"
codegen-units = 1
